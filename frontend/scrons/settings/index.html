<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAPE - Configurações</title>
    <link rel="icon" href="../../assets/foto.png" type="image/png">
    <link rel="shortcut icon" href="../../assets/foto.png" type="image/png">
    <!-- Fonte Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  
    <link rel="stylesheet" href="style.css">
</head>
<body>


    <div class="app-wrapper">

       
        <aside class="sidebar">
            <nav class="menu">
                <div class="menu-header">SAPE</div>
                <a href="../deshboard/index.html"><i class="fas fa-home"></i> Dashboard</a>
                <a href="../students/"><i class="fas fa-graduation-cap"></i> Alunos</a>
                <a href="#"><i class="fas fa-user"></i> Perfil do Aluno</a>
                <a href="#"><i class="fas fa-star"></i> Características</a>
                <a href="#"><i class="fas fa-file-alt"></i> Adaptações de Provas</a>
                <a href="#"><i class="fas fa-chart-bar"></i> Histórico Escolar</a>
                <a href="#"><i class="fas fa-book"></i> Plano de Apoio</a>
                <a href="../admin/admin.html"><i class="fas fa-comments"></i> Professores</a>
                <a href="#"><i class="fas fa-users"></i> Responsáveis</a>
                <a class="active" href="index.html"><i class="fas fa-cog"></i> Configurações</a>
            </nav>
        </aside>

        
        <main class="main-content">
            
            <header class="settings-header">
                <h1 class="main-title">Professores Cadastrados</h1>
                
            </header>

            <div class="settings-container">
                <div class="cards-grid">
                    <section class="settings-card professors-card">
                        <h2 class="card-title">Lista de Professores</h2>
                        <div class="card-content">
                            <div class="filters-section">
                                <div class="search-box">
                                    <i class="fas fa-search"></i>
                                    <input type="text" id="searchInput" placeholder="Buscar por nome, matrícula ou e-mail...">
                                </div>
                            </div>
                            <div id="loadingState" class="loading-state" style="display: none;">
                                <div class="spinner"></div>
                                <span>Carregando professores...</span>
                            </div>
                            <div class="professores-grid" id="professoresGrid"></div>
                            <div class="empty-state" id="emptyState" style="display: none;">
                                <i class="fas fa-user-slash" style="font-size: 2.5rem; margin-bottom: 12px; color: #94a3b8;"></i>
                                <p>Nenhum professor encontrado com esses filtros.</p>
                            </div>
                        </div>
                    </section>
                </div>
            </div>

        </main> <!-- FIM DO CONTEÚDO PRINCIPAL -->

    </div> <!-- FIM DO APP-WRAPPER -->

</body>
</html>
